<!DOCTYPE html>
<html lang="zh-CN">
  <!-- Claude Sonnet 5 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCL 语言图标生成器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<style>
  :root {
    --bg: #14171a;
    --panel: #1c2024;
    --border: #2b3036;
    --text: #e6e8ea;
    --muted: #8b929a;
    --accent: #396;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 20px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input[type="text"] {
    flex: 1;
    background: #0f1113;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: monospace;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  #preview {
    background: #fff;
    border-radius: 10px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 16px;
  }
  #preview svg { width: 100%; height: 100%; }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; }
  #status {
    margin: 8px 0;
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
  }
  #status.error { color: #e5484d; }
</style>
</head>
<body>
  <div class="card">
    <h1>WCL 语言图标生成器</h1>
    <p class="sub">输入语言代码，实时生成对应的 SVG 图标。</p>
    <div id="status"></div>

    <label for="codeInput">语言代码</label>
    <div class="row">
      <input id="codeInput" type="text" maxlength="30" placeholder="例如 zh 或 be-tarask" autocomplete="off">
      <button id="generateBtn" disabled>生成</button>
    </div>

    <div id="preview"><span style="color:#999;font-size:13px;">加载字体中…</span></div>

    <div class="actions">
      <button id="downloadBtn" class="secondary" disabled>下载 SVG</button>
      <button id="copyBtn" class="secondary" disabled>复制 SVG 代码</button>
    </div>

  </div>

<script>
(function () {
  const FONT1_PATH = 'fonts/OverpassMono-Bold.ttf';  // single-line font (batch.py)
  const FONT2_PATH = 'fonts/Montserrat-Bold.ttf';    // line-2/subtag font (ext.py)

  const codeInput   = document.getElementById('codeInput');
  const generateBtn = document.getElementById('generateBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const copyBtn     = document.getElementById('copyBtn');
  const preview     = document.getElementById('preview');
  const statusEl    = document.getElementById('status');

  let font1 = null, font2 = null, capHeight2 = null;
  let currentSVG = null;
  let currentCode = '';

  // Same ring badge markup as the original Python scripts.
  const BADGE_RING = '<g transform="matrix(2,0,0,2,-61.4375,-67.125)">' +
    '<path d="M 255.71875,33.5625 C 178.93962,33.5625 111.10867,72.086118 70.5,130.84375 L 114,155.96875 C 145.8111,112.11504 197.43839,83.5625 255.71875,83.5625 C 313.99911,83.562502 365.6264,112.11504 397.4375,155.96875 L 440.9375,130.84375 C 400.32883,72.086118 332.49788,33.5625 255.71875,33.5625 z " style="fill:#900;stroke:none"/>' +
    '<path d="M 46.8125,174.9375 C 36.442946,200.79582 30.71875,229.01254 30.71875,258.5625 C 30.71875,374.31432 118.2675,469.74106 230.71875,482.1875 L 230.71875,431.75 C 145.95412,419.60155 80.71875,346.67019 80.71875,258.5625 C 80.718751,238.11672 84.234053,218.49436 90.6875,200.25 L 46.8125,174.9375 z " style="fill:#069;stroke:none"/>' +
    '<path d="M 464.625,174.9375 L 420.75,200.25 C 427.20345,218.49436 430.71875,238.11672 430.71875,258.5625 C 430.71875,346.67018 365.48339,419.60155 280.71875,431.75 L 280.71875,482.1875 C 393.16999,469.74106 480.71874,374.31432 480.71875,258.5625 C 480.71875,229.01254 474.99455,200.79582 464.625,174.9375 z " style="fill:#069;stroke:none"/>' +
    '</g>';

  // ---- batch.py params (single-line codes) ----
  const PARAMS_BY_LEN = {
    1: { font_size: 470.0, track: -10, cx: 450, cy: 484.5 + 110 },
    2: { font_size: 470.0, track: -10, cx: 450, cy: 484.5 + 110 },
    3: { font_size: 353.3, track: -10, cx: 450, cy: 484.5 + 70 },
    4: { font_size: 280.0, track: -10, cx: 450, cy: 484.5 + 50 },
  };
  function getParams(code) {
    const p = PARAMS_BY_LEN[code.length];
    if (!p) {
      throw new Error('代码长度超过上限（' + code.length + '/4）');
    }
    return p;
  }

  // ---- ext.py params (extended "primary-subtag" codes) ----
  const CX = 450;
  const LINE1_PARAMS_BY_LEN = {
    1: { font_size: 290.0, track: -10, cy: 455 },
    2: { font_size: 290.0, track: -10, cy: 455 },
    3: { font_size: 290.0, track: -10, cy: 455 },
    4: { font_size: 260.0, track: -10, cy: 455 }
  };
  const LINE2_FONT_SIZE = 190.0;
  const LINE2_TRACK = 0;
  const CIRCLE_CENTER_Y = 450;
  const CIRCLE_RADIUS = 350;
  const TEXT_INSET = 30;
  const LINE2_CY = 680;
  const SX_THRESHOLD_1 = 0.8;
  const FONT_SCALE_MIN = 0.25;

  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', !!isError);
  }

  function requireGlyph(font, ch) {
    const glyph = font.charToGlyph(ch);
    if (!glyph || glyph.index === 0) {
      throw new Error('字体不支持字符: "' + ch + '"');
    }
    return glyph;
  }

  // Width a piece of text would take at a given font size/tracking,
  // mirroring build_text_paths()'s total_w in both batch.py and ext.py.
  function measureWidth(text, font, fontSize, track) {
    const scale = fontSize / font.unitsPerEm;
    let x = 0;
    for (const ch of text) {
      const glyph = requireGlyph(font, ch);
      x += glyph.advanceWidth * scale + track;
    }
    return x - track;
  }

  // Builds already-positioned/scaled <path> markup for a line of text.
  // opentype.js's getPath already returns SVG (y-down) coordinates, so
  // unlike the Python version we don't need a separate flip transform.
  function layoutGlyphs(text, font, fontSize, track, startX, cy) {
    const scale = fontSize / font.unitsPerEm;
    let curX = startX;
    let out = '';
    for (const ch of text) {
      const glyph = requireGlyph(font, ch);
      const path = glyph.getPath(curX, cy, fontSize);
      out += '<path d="' + path.toPathData(2) + '" style="fill:#396;stroke:none"/>';
      curX += glyph.advanceWidth * scale + track;
    }
    return out;
  }

  // ---- single-line generator (batch.py) ----
  function buildSimpleSVG(code) {
    const p = getParams(code);
    const totalWidth = measureWidth(code, font1, p.font_size, p.track);
    const startX = p.cx - totalWidth / 2;
    const glyphPaths = layoutGlyphs(code, font1, p.font_size, p.track, startX, p.cy);
    return wrapSVG(BADGE_RING + '\n' + glyphPaths);
  }

  // ---- cap height helper (ext.py's _get_cap_height) ----
  function getCapHeight(font) {
    const os2 = font.tables && font.tables.os2;
    if (os2 && os2.version >= 2 && os2.sCapHeight) {
      return os2.sCapHeight;
    }
    // Fallback: measure the bounding box of "H" directly, at 1:1 scale
    // (fontSize == unitsPerEm), same idea as the Python BoundsPen fallback.
    const glyph = requireGlyph(font, 'H');
    const path = glyph.getPath(0, 0, font.unitsPerEm);
    const bbox = path.getBoundingBox();
    if (bbox && isFinite(bbox.y1)) {
      return Math.abs(bbox.y1);
    }
    return Math.round(font.unitsPerEm * 0.7);
  }

  function availableWidthAt(cy, inset) {
    const r = CIRCLE_RADIUS - inset;
    const dy = cy - CIRCLE_CENTER_Y;
    if (Math.abs(dy) >= r) return 0;
    return 2 * Math.sqrt(r * r - dy * dy);
  }

  function cyForFontScale(fontScale) {
    const nominalScale = LINE2_FONT_SIZE / font2.unitsPerEm;
    const shrunkScale = nominalScale * fontScale;
    return LINE2_CY - capHeight2 * (nominalScale - shrunkScale);
  }

  function solveFontScale(totalW2Base, sx) {
    const nominalScale = LINE2_FONT_SIZE / font2.unitsPerEm;
    const capTopY = LINE2_CY - capHeight2 * nominalScale;
    const k = capHeight2 * nominalScale;
    const r = CIRCLE_RADIUS - TEXT_INSET;
    const C = sx * totalW2Base;
    const D0 = capTopY - CIRCLE_CENTER_Y;
    const a = C * C + 4 * k * k;
    const b = 8 * D0 * k;
    const c = 4 * D0 * D0 - 4 * r * r;
    const disc = b * b - 4 * a * c;
    if (disc < 0) return null;
    const sqrtDisc = Math.sqrt(disc);
    for (const scale of [(-b + sqrtDisc) / (2 * a), (-b - sqrtDisc) / (2 * a)]) {
      if (scale > 0 && scale <= 1) return scale;
    }
    return null;
  }

  // Renders only the ring + primary-tag line, used for the transient
  // "primary-" state while the user hasn't typed the subtag yet.
  function buildPrimaryOnlySVG(primary) {
    const l1p = LINE1_PARAMS_BY_LEN[primary.length];
    if (!l1p) {
      throw new Error('主标签长度超过上限（' + primary.length + '/4）');
    }
    const totalW1 = measureWidth(primary, font1, l1p.font_size, l1p.track);
    const startX1 = CX - totalW1 / 2;
    const svgLine1 = layoutGlyphs(primary, font1, l1p.font_size, l1p.track, startX1, l1p.cy);
    return wrapSVG(BADGE_RING + '\n' + svgLine1);
  }

  // ---- extended "primary-subtag" generator (ext.py) ----
  function buildExtendedSVG(code) {
    const dashIdx = code.indexOf('-');
    const primary = code.slice(0, dashIdx);
    const subtag = code.slice(dashIdx + 1);
    if (!primary || !subtag) {
      throw new Error('扩展代码格式应为 "主标签-子标签"，例如 be-tarask');
    }

    const l1p = LINE1_PARAMS_BY_LEN[primary.length];
    if (!l1p) {
      throw new Error('主标签长度超过上限（' + primary.length + '/4）');
    }

    // Line 1 (primary tag, monospace font).
    const totalW1 = measureWidth(primary, font1, l1p.font_size, l1p.track);
    const startX1 = CX - totalW1 / 2;
    const svgLine1 = layoutGlyphs(primary, font1, l1p.font_size, l1p.track, startX1, l1p.cy);

    // Line 2 (subtag, Montserrat font): squeeze horizontally first, then
    // shrink font size (anchored at cap-height) if squeezing isn't enough.
    let fontSize2 = LINE2_FONT_SIZE, track2 = LINE2_TRACK;
    let totalW2 = measureWidth(subtag, font2, fontSize2, track2);
    const availableAtCy = availableWidthAt(LINE2_CY, TEXT_INSET);
    const sxAtFull = totalW2 ? availableAtCy / totalW2 : 1.0;

    let cy2, sx;
    if (sxAtFull >= 1.0) {
      cy2 = LINE2_CY; sx = 1.0;
    } else if (sxAtFull >= SX_THRESHOLD_1) {
      cy2 = LINE2_CY; sx = sxAtFull;
    } else {
      sx = SX_THRESHOLD_1;
      const fontScale = solveFontScale(totalW2, sx);
      if (fontScale === null || fontScale < FONT_SCALE_MIN) {
        throw new Error('子标签 "' + subtag + '" 太长，压缩+缩小后仍放不下');
      }
      fontSize2 = LINE2_FONT_SIZE * fontScale;
      track2 = LINE2_TRACK * fontScale;
      totalW2 = measureWidth(subtag, font2, fontSize2, track2);
      cy2 = cyForFontScale(fontScale);
    }

    const startX2 = CX - totalW2 / 2;
    const inner2 = layoutGlyphs(subtag, font2, fontSize2, track2, startX2, cy2);
    const svgLine2 = '<g transform="translate(' + CX + ',0) scale(' + sx + ',1) translate(' + (-CX) + ',0)">' + inner2 + '</g>';

    return wrapSVG(BADGE_RING + '\n' + svgLine1 + '\n' + svgLine2);
  }

  function wrapSVG(inner) {
    return '<?xml version="1.0" encoding="UTF-8"?>\n' +
      '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">\n' +
      inner + '\n</svg>\n';
  }

  function escapeHTML(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Neutral idle state (empty input / fonts still loading) — no red, no drama.
  function showIdle(msg) {
    currentSVG = null;
    downloadBtn.disabled = true;
    copyBtn.disabled = true;
    preview.innerHTML = '<span style="color:#999;font-size:13px;">' + escapeHTML(msg) + '</span>';
    setStatus('');
  }

  // Error state: wipe the canvas and put the error ON it, big and red,
  // so it can't be missed (instead of leaving stale artwork on screen).
  function showError(msg) {
    currentSVG = null;
    downloadBtn.disabled = true;
    copyBtn.disabled = true;
    preview.innerHTML =
      '<div style="width:100%;height:100%;background:#e5484d;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;box-sizing:border-box;">' +
      '<div style="font-size:44px;line-height:1;margin-bottom:10px;">&#9888;&#65039;</div>' +
      '<div style="font-size:14px;font-weight:600;word-break:break-word;">' + escapeHTML(msg) + '</div>' +
      '</div>';
    setStatus(msg, true);
  }

  function generate() {
    if (!font1 || !font2) return; // fonts not ready yet, ignore silently
    const code = codeInput.value.trim();
    if (!code) {
      showIdle('输入代码后自动生成');
      return;
    }

    // "primary-" with no subtag yet is just mid-typing, not a real error —
    // preview the primary line alone instead of slamming a red error screen.
    if (code.endsWith('-') && code.indexOf('-') === code.length - 1) {
      const primary = code.slice(0, -1);
      if (!primary) {
        showIdle('输入代码后自动生成');
        return;
      }
      try {
        preview.innerHTML = buildPrimaryOnlySVG(primary);
        currentSVG = null;
        downloadBtn.disabled = true;
        copyBtn.disabled = true;
        setStatus('继续输入子标签…');
      } catch (e) {
        showError(e.message);
      }
      return;
    }

    try {
      const svg = code.includes('-') ? buildExtendedSVG(code) : buildSimpleSVG(code);
      currentSVG = svg;
      currentCode = code;
      preview.innerHTML = currentSVG;
      downloadBtn.disabled = false;
      copyBtn.disabled = false;
      setStatus('已生成 "' + code + '" 的图标');
    } catch (e) {
      showError(e.message);
    }
  }

  function download() {
    if (!currentSVG) return;
    const blob = new Blob([currentSVG], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'WCL_language_icon_' + currentCode + '.svg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function copySVG() {
    if (!currentSVG) return;
    try {
      await navigator.clipboard.writeText(currentSVG);
      setStatus('SVG 代码已复制到剪贴板');
    } catch (e) {
      setStatus('复制失败，请手动选择文本', true);
    }
  }

  generateBtn.addEventListener('click', generate);
  downloadBtn.addEventListener('click', download);
  copyBtn.addEventListener('click', copySVG);

  // Real-time rendering: regenerate on every keystroke, lightly debounced
  // so a burst of fast typing doesn't fire dozens of rebuilds back to back.
  let debounceTimer = null;
  function scheduleGenerate() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(generate, 120);
  }
  codeInput.addEventListener('input', scheduleGenerate);
  codeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      clearTimeout(debounceTimer);
      generate();
    }
  });

  function loadFont(path) {
    return new Promise((resolve, reject) => {
      opentype.load(path, (err, font) => err ? reject(err) : resolve(font));
    });
  }

  Promise.all([loadFont(FONT1_PATH), loadFont(FONT2_PATH)]).then(([f1, f2]) => {
    font1 = f1;
    font2 = f2;
    capHeight2 = getCapHeight(font2);
    generateBtn.disabled = false;
    setStatus('就绪');
    if (codeInput.value.trim()) {
      generate();
    } else {
      showIdle('字体已加载，输入代码后自动生成');
    }
  }).catch((err) => {
    showError('字体加载失败：' + err);
  });
})();
</script>
</body>
</html>
